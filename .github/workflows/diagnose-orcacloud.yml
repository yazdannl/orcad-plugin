name: Diagnose OrcaCloud publish (temporary)

# Temporary: reports why api.orcaslicer.com rejects this repository's publish
# identity. Mints the same OIDC token packaging/publish_orcacloud.sh requests and
# posts probes with a deliberately too-low version, so a valid identity can only
# ever be answered with a version error - the run separates the identity failure
# (401) from any other. The token is never printed; only the API's responses are.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  probe:
    name: Probe the publish identity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe every candidate audience
        run: |
          set -euo pipefail
          mint() { # $1 = audience
            curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=$1" |
            python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))'
          }
          printf '# version = "0.9.1"\n# probe only: the version is lower than the\n# published one, so nothing can be released.\n' > orcad_probe.py
          for audience in orcacloud "https://api.orcaslicer.com" api.orcaslicer.com \
                          orcaslicer orcacloud.com "https://orcacloud.com" \
                          "https://api.orcaslicer.com/api/v1/plugin-publish/releases"; do
            token="$(mint "$audience")"
            if [ -z "$token" ]; then
              echo "::notice title=probe [$audience]::no token returned"
              continue
            fi
            status="$(curl -sS -o "$RUNNER_TEMP/body.txt" -w '%{http_code}' \
              -H "Authorization: Bearer $token" \
              -F 'metadata={"version":"0.9.1"}' -F 'files=@orcad_probe.py' \
              https://api.orcaslicer.com/api/v1/plugin-publish/releases)" || status=curl-failed
            echo "::notice title=probe [$audience]::HTTP $status $(head -c 300 "$RUNNER_TEMP/body.txt")"
            unset token
          done
          rm -f orcad_probe.py
