name: Publish to OrcaCloud

# Publishes every tagged release to Orca Cloud. Identity is a short-lived OIDC
# token signed by GitHub (audience "orcacloud"), so there is no secret to store,
# copy or rotate. The repository must be connected to exactly one of your
# Orca Cloud plugins under Edit plugin > GitHub publishing, otherwise the API
# answers 401.
#
# The workflow name and the job permissions follow the published setup guide,
# since the OIDC token carries this workflow's name. The tag trigger is what
# normally runs this: releases created by ci.yml with the built-in GITHUB_TOKEN
# do not trigger workflows, so a tag-push run is the automatic path. The release
# trigger covers releases published from the GitHub UI, and workflow_dispatch
# re-publishes the newest release after a failure without cutting a new tag.
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to OrcaCloud
    runs-on: ubuntu-latest
    env:
      # Space-separated globs matching the plugin files to upload (.py / .whl).
      # The filename must end in a supported target OS/arch suffix; orcad is
      # pure Python, so the universal "_any" suffix covers every platform.
      PLUGIN_FILES: "orcad_any.py"
    steps:
      - uses: actions/checkout@v4
      - name: Stage the plugin under its cloud filename
        run: cp orcad.py orcad_any.py
      - name: Publish release to OrcaCloud
        run: bash packaging/publish_orcacloud.sh
