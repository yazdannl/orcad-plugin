name: Publish to OrcaCloud

# Publishes every tagged release to Orca Cloud. Identity is a short-lived OIDC
# token signed by GitHub (audience "orcacloud"), so there is no secret to store,
# copy or rotate. The repository must be connected to exactly one of your
# Orca Cloud plugins under Edit plugin > GitHub publishing, otherwise the API
# answers 401.
#
# The workflow name and the job permissions follow the published setup guide,
# since the OIDC token carries this workflow's name. The tag trigger is what
# normally runs this: releases created by ci.yml with the built-in GITHUB_TOKEN
# do not trigger workflows, so a tag-push run is the automatic path. The release
# trigger covers releases published from the GitHub UI, and workflow_dispatch
# re-publishes the newest release after a failure without cutting a new tag.
on:
  push:
    branches: [main]  # TEMPORARY PROBE

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to OrcaCloud
    runs-on: ubuntu-latest
    env:
      # Space-separated globs matching the plugin files to upload (.py / .whl).
      # The filename must end in a supported target OS/arch suffix; orcad is
      # pure Python, so the universal "_any" suffix covers every platform.
      PLUGIN_FILES: "orcad_any.py"
    steps:
      - uses: actions/checkout@v4
      - name: Probe the publish identity from this workflow file
        run: |
          set -euo pipefail
          response="$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=orcacloud")"
          token="$(printf '%s' "$response" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("value",""))')"
          [ -n "$token" ] || { echo "::error title=probe::$response"; exit 1; }
          printf '%s' "$token" > "$RUNNER_TEMP/token.txt"
          printf '%s' "$token" | python3 -c '
          import base64, json, sys
          raw = sys.stdin.read(); payload = raw.split(".")[1] + "=" * (-len(raw.split(".")[1]) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for key in ("iss","aud","sub","repository","workflow_ref","job_workflow_ref","ref"):
              print(f"{key}={claims.get(key)}")'
          printf '# version = "0.9.1"\n# probe only: too low to publish\n' > orcad_probe.py
          status="$(curl -sS -o "$RUNNER_TEMP/body.txt" -w '%{http_code}' \
            -H "Authorization: Bearer $(cat "$RUNNER_TEMP/token.txt")" \
            -F 'metadata={"version":"0.9.1"}' -F 'files=@orcad_probe.py' \
            https://api.orcaslicer.com/api/v1/plugin-publish/releases)" || status=curl-failed
          echo "::notice title=probe::HTTP $status"
          echo "::notice title=probe body::$(head -c 400 "$RUNNER_TEMP/body.txt")"
          rm -f orcad_probe.py "$RUNNER_TEMP/token.txt"
