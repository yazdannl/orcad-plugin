name: Publish to Orca Cloud

# Publishes every tagged release to Orca Cloud. Identity is a short-lived OIDC
# token signed by GitHub (audience "orcacloud"), so there is no secret to store,
# copy or rotate. The repository must be connected to exactly one of your
# Orca Cloud plugins under Edit plugin > GitHub publishing, otherwise the API
# answers 401.
#
# Publishing happens from this workflow on purpose: the connection is made for a
# release workflow, and Orca Cloud matches the token against it, so a publish
# step bolted onto an unrelated workflow is rejected as "not a connected
# release workflow".
#
# The tag trigger is what normally runs this. The release trigger additionally
# covers releases published from the GitHub UI (releases created by ci.yml with
# the built-in GITHUB_TOKEN do not trigger workflows, so ci.yml does not publish
# and this workflow cannot be triggered by its own release).
on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    name: Publish to Orca Cloud
    runs-on: ubuntu-latest
    env:
      # Space-separated globs matching the plugin files to upload (.py / .whl).
      # The filename must end in a supported target OS/arch suffix; orcad is
      # pure Python, so the universal "_any" suffix covers every platform.
      PLUGIN_FILES: "orcad_any.py"
    steps:
      - uses: actions/checkout@v4
      - name: Stage the plugin under its cloud filename
        run: cp orcad.py orcad_any.py
      - name: Publish release to Orca Cloud
        run: bash packaging/publish_orcacloud.sh
