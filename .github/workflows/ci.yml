name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0" # matches the Node version orcad provisions for the AI agent
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8"
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Tests and bundle freshness
        run: python packaging/check.py

  release:
    name: GitHub release
    needs: verify
    # needs: verify already ran packaging/check.py against this exact commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # Orca Cloud trusted publishing (OIDC, no secret)
    env:
      PLUGIN_FILES: "orcad_any.py"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Release notes from CHANGELOG.md
        run: python packaging/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish the release with orcad.py attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; refreshing its notes instead of failing."
            gh release edit "$GITHUB_REF_NAME" --title "orcad $GITHUB_REF_NAME" --notes-file notes.md
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "orcad $GITHUB_REF_NAME" \
              --notes-file notes.md \
              orcad.py
          fi
      # GitHub suppresses workflow triggers for events created with the
      # built-in GITHUB_TOKEN, so publish-orcacloud.yml would never fire for
      # this release; publish from here instead. A release published from the
      # GitHub UI instead does trigger that workflow.
      - name: Stage the plugin under its cloud filename
        run: cp orcad.py orcad_any.py
      - name: Publish this version to Orca Cloud
        run: bash packaging/publish_orcacloud.sh
