name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0" # matches the Node version orcad provisions for the AI agent
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check "pytest>=8"
      - name: Frontend tests
        working-directory: frontend
        run: npm test
      - name: Tests and bundle freshness
        run: python packaging/check.py

  release:
    name: GitHub release
    needs: verify
    # needs: verify already ran packaging/check.py against this exact commit
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.21.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Release notes from CHANGELOG.md
        run: python packaging/release_notes.py "$GITHUB_REF_NAME" > notes.md
      - name: Publish the release with the plugin attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          # orcad.py is the friendly name; orcad_any.py is the same bytes under
          # the target suffix Orca Cloud requires, attached as well so either
          # name resolves to a valid upload.
          cp orcad.py orcad_any.py
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME exists; refreshing its notes instead of failing."
            gh release edit "$GITHUB_REF_NAME" --title "orcad $GITHUB_REF_NAME" --notes-file notes.md
            gh release upload "$GITHUB_REF_NAME" orcad_any.py --clobber
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "orcad $GITHUB_REF_NAME" \
              --notes-file notes.md \
              orcad.py orcad_any.py
          fi
      # Publishing to Orca Cloud lives in publish-orcacloud.yml, which the
      # connection in the Orca Cloud portal refers to and which runs on this
      # tag push.
